name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Linux builds on the oldest supported Ubuntu, so the binary runs on older glibc too.
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo sh packaging/linux/build-deps.sh
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Lint
        run: cargo clippy -p diskie-model -p diskie-scan -p diskie-update -p diskie -p xtask --all-targets -- -D warnings
      - name: Test
        run: cargo test -p diskie-model -p diskie-scan -p diskie-update -p diskie
      - name: Build
        run: cargo build --release -p diskie
