# Publishes a release when a version tag (v1.2.3) is pushed.
#
# Each platform is built and tested on its own runner; the publish job then signs every download
# with the project's minisign key, held in the DISKIE_SIGNING_KEY secret (the contents of
# diskie-release.key). Diskie verifies that signature against the public key in
# keys/diskie-release.pub before it installs any update.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p diskie-model -p diskie-scan -p diskie-analyze -p diskie-store -p diskie-update -p diskie
      - name: Build
        run: cargo build --profile dist -p diskie
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/dist/Diskie.exe
          if-no-files-found: error

  linux:
    # The oldest supported Ubuntu, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Build dependencies
        run: sudo sh packaging/linux/build-deps.sh
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test -p diskie-model -p diskie-scan -p diskie-analyze -p diskie-store -p diskie-update -p diskie
      - name: Build
        run: cargo build --profile dist -p diskie
      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash packaging/linux/package.sh "$version" target/dist/Diskie linux
          cp target/dist/Diskie linux/diskie
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: linux/
          if-no-files-found: error

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/download-artifact@v4
        with:
          path: built
      - name: Sign and write latest.json
        env:
          DISKIE_SIGNING_KEY: ${{ secrets.DISKIE_SIGNING_KEY }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="docs/releases/${version}.md"
          [ -f "$notes" ] || { echo "missing $notes"; exit 1; }
          export DISKIE_RELEASE_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          cargo xtask release "$version" dist "$notes" \
            windows-x86_64=built/windows/Diskie.exe \
            linux-x86_64=built/linux/diskie \
            linux-x86_64-appimage=built/linux/Diskie-x86_64.AppImage \
            extra=built/linux/Diskie-${version}-linux-x64.tar.gz
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # A full release, not a pre-release: /releases/latest only ever points at full releases,
          # and that is where installed copies look for updates.
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "Diskie ${version}" \
            --notes-file "docs/releases/${version}.md" \
            --verify-tag
