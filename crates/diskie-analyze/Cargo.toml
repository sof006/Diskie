[package]
name = "diskie-analyze"
version.workspace = true
description = "Analyses over a Diskie tree: largest files, search, duplicates, clean-up suggestions, comparing scans, export"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
diskie-model = { path = "../diskie-model" }
blake3 = "1"
same-file = "1"
serde_json = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
