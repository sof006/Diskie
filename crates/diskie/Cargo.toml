[package]
name = "diskie"
version.workspace = true
description = "A fast disk space analyzer"
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "Diskie"
path = "src/main.rs"

[dependencies]
diskie-analyze = { path = "../diskie-analyze" }
diskie-model = { path = "../diskie-model" }
diskie-scan = { path = "../diskie-scan" }
diskie-store = { path = "../diskie-store" }
diskie-update = { path = "../diskie-update" }
gpui-kit = { version = "=0.10.0", default-features = false }
image = { version = "0.25", default-features = false }
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Com", "Win32_System_Console", "Win32_System_Kernel", "Win32_System_LibraryLoader", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"
