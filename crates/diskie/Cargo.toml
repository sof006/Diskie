[package]
name = "diskie"
version.workspace = true
description = "A fast disk space analyzer"
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "Diskie"
path = "src/main.rs"

[dependencies]
diskie-model = { path = "../diskie-model" }
diskie-scan = { path = "../diskie-scan" }
diskie-update = { path = "../diskie-update" }
gpui-kit = { version = "=0.10.0", default-features = false }
image = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trash = "5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3"
