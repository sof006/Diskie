[package]
name = "spike-scan"
version = "0.0.0"
description = "Week-1 spike: compare Win32 directory enumeration with reading the NTFS MFT"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
rayon = "1"

[target.'cfg(windows)'.dependencies]
ntfs-reader = "=0.6.0"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_ProcessStatus"] }
