[workspace]
resolver = "3"
members = [
    "crates/diskie",
    "crates/diskie-model",
    "crates/diskie-scan",
    "crates/diskie-update",
    "xtask",
    "spikes/spike-data",
    "spikes/spike-gpui",
    "spikes/spike-iced",
    "spikes/spike-scan",
]
default-members = ["crates/diskie"]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 16

[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1
strip = true
debug = false
